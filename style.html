<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width" />
  <title>スタイル</title>
  <style>
    body {
      margin: 20px;
      font-size: 28px;
      color: #333;
    }

    .name {
      font-weight: bold;
    }

    .from {
      color: blue;
    }
  </style>
</head>

<body>
  <p>
    私の名前は、<span class="name">矢野立凰</span>です。
    私は犬を飼っています。
    出身は、<span class="from">茨城県</span>です。
    どうぞよろしくおねがいします。
  </p>
</body>

</html>
